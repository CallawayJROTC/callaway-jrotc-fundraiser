name: Sync Fundraiser Total

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update fundraiser total
        run: python scripts/update_fundraiser.py

      - name: Commit updated total
        run: |
          if git diff --quiet fundraiser-data.json; then
            echo "No fundraiser total change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fundraiser-data.json
          git commit -m "Update fundraiser total"
          git push
